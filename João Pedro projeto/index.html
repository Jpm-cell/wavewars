<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lâmina das Ondas</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: #0d1417; color: #fff; overflow: hidden; width: 100vw; height: 100vh; }
    canvas { display: block; position: absolute; top: 0; left: 0; z-index: 1; }
    
    #ov { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 10; display: flex; align-items: center; justify-content: center; background: rgba(13, 20, 23, 0.85); backdrop-filter: blur(8px); }
    #pn { background: #162226; border: 1px solid #24353b; border-radius: 12px; padding: 24px; width: 650px; max-width: 90vw; max-height: 85vh; overflow-y: auto; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
    
    h1 { color: #3ddc97; font-size: 28px; margin-bottom: 8px; text-shadow: 0 0 10px rgba(61,220,151,0.3); }
    h3 { color: #8fa39b; font-size: 16px; margin: 16px 0 8px 0; text-transform: uppercase; letter-spacing: 1px; border-bottom: 1px solid #24353b; padding-bottom: 4px; }
    p { color: #a0b0a8; font-size: 14px; margin-bottom: 16px; }
    
    .row { display: flex; gap: 10px; align-items: center; margin-bottom: 16px; flex-wrap: wrap; }
    button { background: #2f7d5a; color: #fff; border: none; padding: 10px 18px; border-radius: 6px; font-weight: bold; cursor: pointer; transition: all 0.2s; }
    button:hover { background: #3ddc97; color: #0d1417; transform: translateY(-1px); }
    button:disabled { background: #22332c; color: #55665e; cursor: not-allowed; transform: none; }
    button.g { background: #24353b; color: #a0b0a8; }
    button.g:hover { background: #344850; color: #fff; }
    button.f { background: #b87b2a; color: #fff; }
    button.f:hover { background: #ffb02e; color: #0d1417; }
    button.t { background: #1c2a2e; border: 1px solid #24353b; border-bottom: none; border-radius: 6px 6px 0 0; padding: 8px 16px; }
    button.t.on { background: #2f7d5a; border-color: #3ddc97; }

    input, select { background: #0d1417; border: 1px solid #24353b; color: #fff; padding: 10px; border-radius: 6px; outline: none; }
    input:focus, select:focus { border-color: #3ddc97; }

    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 12px; margin-bottom: 16px; }
    .card { background: #1a282c; border-left: 4px solid var(--c, #fff); border-radius: 6px; padding: 12px; display: flex; flex-direction: column; gap: 6px; font-size: 13px; }
    .card b { font-size: 15px; color: #fff; }
    .card i { background: #0d1417; height: 6px; border-radius: 3px; overflow: hidden; display: block; margin: 4px 0; }
    .card u { background: #3ddc97; height: 100%; display: block; }

    #slot { background: #0d1417; border: 2px dashed var(--c, #ffffff33); border-radius: 8px; padding: 20px; text-align: center; font-size: 20px; font-weight: bold; margin-bottom: 16px; color: var(--c, #fff); }
    .rt { font-size: 12px; color: #6b7c75; display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
    .mats { display: flex; gap: 12px; font-weight: bold; font-size: 14px; background: #0d1417; padding: 8px 12px; border-radius: 6px; margin-bottom: 16px; border: 1px solid #24353b; }

    #banner { position: absolute; top: 15%; left: 50%; transform: translate(-50%, -50%) scale(0.8); background: rgba(61,220,151,0.15); border: 1px solid #3ddc97; color: #3ddc97; padding: 12px 36px; border-radius: 30px; font-weight: bold; font-size: 22px; pointer-events: none; opacity: 0; z-index: 5; transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
    #banner.b { opacity: 1; transform: translate(-50%, -50%) scale(1); }

    #hud { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 2; padding: 20px; display: flex; flex-direction: column; justify-content: space-between; }
    .bar { background: rgba(13, 20, 23, 0.7); border: 1px solid #24353b; width: 280px; height: 16px; border-radius: 8px; overflow: hidden; margin-bottom: 4px; }
    .fill { background: #ff4d5e; height: 100%; width: 100%; transition: width 0.2s; }
    .fill.xp { background: var(--c, #3ddc97); }

    #adm { position: absolute; bottom: 10px; right: 10px; background: #162226; border: 1px solid #3ddc97; border-radius: 8px; padding: 12px; z-index: 20; width: 320px; font-size: 12px; display: flex; flex-direction: column; gap: 8px; }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

  <div id="banner"></div>

  <div id="hud" style="display:none;">
    <div>
      <div class="bar"><div id="hp" class="fill"></div></div>
      <div id="lv" style="font-weight:bold; font-size:13px; text-shadow:0 1px 3px #000;">Nível 1</div>
      <div id="wv" style="color:#3ddc97; font-weight:bold; margin-top:4px;">Onda 1</div>
      <div id="en" style="font-size:12px; color:#8fa39b;">Inimigos: 0</div>
    </div>

    <div style="text-align: right;">
      <div id="co" style="color:#ffb02e; font-weight:bold; font-size:18px;">Moedas: 0</div>
      <div id="mt" style="font-size:12px; color:#a0b0a8; margin-top:2px;"></div>
      <div id="wn" style="font-weight:bold; margin-top:8px;"></div>
      <div class="bar" style="width:180px; height:8px; margin-left:auto; margin-top:4px;"><div id="wx" class="fill xp"></div></div>
      <div id="ac" style="font-size:11px; color:#8fa39b; margin-top:2px;"></div>
    </div>
  </div>

  <div id="ov">
    <div id="pn"></div>
  </div>

  <div id="adm" hidden></div>

  <script src="script.js"></script>
</body>
</html>
